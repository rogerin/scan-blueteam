[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hubbits-pentest-agents"
version = "0.1.0"
description = "Pipeline controlada de agentes para pentest não destrutivo"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
bedrock = ["boto3>=1.44.0"]

[project.scripts]
pentest-agents = "pentest_pipeline.__main__:main"

[tool.setuptools.packages.find]
include = ["pentest_pipeline*"]
